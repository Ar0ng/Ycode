name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npx vite build

      - name: Rust tests
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo test --locked 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) {
            # Public annotation with the failing tests and their panic messages.
            $lines = Select-String -Path test.log -Pattern '^test .* FAILED$|panicked at|^---- |assertion|left:|right:|error(\[E\d+\])?:' |
              Select-Object -First 60 | ForEach-Object { $_.Line -replace '\x1b\[[0-9;]*m', '' }
            Write-Output "::error title=Rust tests failed::$($lines -join '%0A')"
            exit 1
          }

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
